<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友情链接管理 · Sunrise's blog</title>
    <style>
        /* ------ Liushen × iOS26 Design Tokens ------ */
        :root {
            --primary: #2679cc;
            --primary-light: rgba(38, 121, 204, 0.08);
            --primary-gradient: linear-gradient(135deg, #2679cc 0%, #4a90e2 100%);
            --accent: #00c4b6;
            --hover: #ff7242;
            --text: #1f2d3d;
            --text-body: #4c4948;
            --text-meta: #858585;
            --text-mute: #99a9bf;
            --text-primary: #1f2d3d;
            --text-secondary: #6b7a8d;
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-shadow: 0 8px 32px rgba(31, 38, 73, 0.06), 0 2px 8px rgba(31, 38, 73, 0.04);
            --card-shadow-hover: 0 16px 48px rgba(31, 38, 73, 0.1), 0 4px 16px rgba(31, 38, 73, 0.06);
            --card-radius: 18px;
            --sidebar-bg: rgba(255, 255, 255, 0.45);
            --sidebar-gradient: linear-gradient(135deg, #ffe4ec 0%, #e0f0ff 50%, #e8f8f5 100%);
            --body-bg: #f0f2f5;
            --divider: rgba(0, 0, 0, 0.06);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --body-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;

            --sidebar-width: 280px;
            --sidebar-header-h: 80px;
        }

        [data-theme="dark"] {
            --primary: #5fa9ff;
            --primary-light: rgba(95, 169, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #5fa9ff 0%, #7cb8ff 100%);
            --accent: #2dd4bf;
            --hover: #ffb38a;
            --text: #e6edf3;
            --text-body: #c9d1d9;
            --text-meta: #8b949e;
            --text-mute: #6e7681;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --card-bg: rgba(22, 27, 34, 0.6);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.3);
            --sidebar-bg: rgba(22, 27, 34, 0.5);
            --sidebar-gradient: linear-gradient(135deg, #2a1e2c 0%, #1c2c40 100%);
            --body-bg: #0d1117;
            --divider: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(22, 27, 34, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--body-font);
            background: var(--body-bg);
            min-height: 100vh;
            line-height: 1.6;
            color: var(--text-body);
            transition: background-color .4s var(--ease-out), color .4s ease;
            overflow-x: hidden;
            font-feature-settings: -apple-system, "kern", "liga";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Decorative background orbs */
        body::before {
            content: "";
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(38, 121, 204, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -15%;
            left: 20%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(0, 196, 182, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ======= Sidebar ======= */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: width 0.45s var(--spring), border-right 0.3s ease;
            overflow: hidden;
            box-shadow: 4px 0 24px rgba(31, 38, 73, 0.04);
        }

        .sidebar-header {
            height: var(--sidebar-header-h);
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--divider);
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--sidebar-gradient) 0%, transparent 100%);
            position: relative;
        }

        .sidebar-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--divider) 30%, var(--divider) 70%, transparent);
        }

        .sidebar-header-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 14px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(38, 121, 204, 0.25);
            transition: transform 0.3s var(--spring);
        }

        .sidebar-header-icon svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .sidebar-header-sub {
            font-size: 12px;
            color: var(--text-meta);
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s ease;
            margin-top: 2px;
        }

        .sidebar-menu {
            flex: 1;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .sidebar-menu::-webkit-scrollbar { width: 4px; }
        .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
        .sidebar-menu::-webkit-scrollbar-thumb {
            background: rgba(38, 121, 204, 0.15);
            border-radius: 2px;
        }
        [data-theme="dark"] .sidebar-menu::-webkit-scrollbar-thumb {
            background: rgba(95, 169, 255, 0.2);
        }

        .sidebar-menu-group {
            margin-bottom: 8px;
        }

        .sidebar-collapse-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s var(--spring);
            padding: 0;
            box-shadow: var(--glass-highlight);
        }

        [data-theme="dark"] .sidebar-collapse-icon {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-collapse-icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s var(--spring);
        }

        .sidebar-collapse-icon:hover {
            background: var(--primary);
            color: #fff;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(38, 121, 204, 0.3);
        }

        .sidebar-menu-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 46px;
            padding: 0 14px;
            border-radius: 14px;
            color: var(--text-body);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s var(--ease-out);
            white-space: nowrap;
            text-decoration: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .sidebar-menu-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 2px;
            transition: transform 0.3s var(--spring);
        }

        .sidebar-menu-item:hover {
            background: var(--primary-light);
            color: var(--primary);
            transform: translateX(4px);
        }

        .sidebar-menu-item:hover .sidebar-menu-icon {
            transform: scale(1.1);
        }

        .sidebar-menu-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-menu-item.active::before {
            transform: translateY(-50%) scaleY(1);
        }

        .sidebar-menu-item.active .sidebar-menu-text {
            color: var(--primary);
        }

        .sidebar-menu-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--spring);
        }

        .sidebar-menu-icon svg {
            width: 100%;
            height: 100%;
            stroke-width: 1.75;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-menu-text {
            flex: 1;
            transition: opacity 0.3s ease;
            letter-spacing: -0.005em;
            color: var(--text);
        }

        /* Locked menu item styles */
        .sidebar-menu-item.locked {
            opacity: 0.6;
            cursor: help;
        }
        .sidebar-menu-item.locked:hover {
            opacity: 0.75;
        }
        .sidebar-menu-item.locked::after {
            content: attr(data-tooltip);
            position: absolute;
            left: calc(100% + 8px);
            top: 50%;
            transform: translateY(-5px);
            background: rgba(31, 45, 61, 0.92);
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 200;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .sidebar-menu-item.locked:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateY(0);
        }

        /* ======= Header Right (Login/User) ======= */
        .header-right {
            display: flex;
            align-items: center;
        }

        .header-login-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-login-btn:hover {
            background: var(--primary-gradient);
            color: #fff;
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .header-login-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 6px 6px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-user-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(38, 121, 204, 0.3);
        }

        [data-theme="light"] .header-user-icon {
            background: linear-gradient(135deg, #2679cc 0%, #4a90e2 100%);
        }

        [data-theme="dark"] .header-user-icon {
            background: linear-gradient(135deg, #5fa9ff 0%, #7cb8ff 100%);
        }

        .header-user-icon svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-user-detail {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .header-user-label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-user-value {
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 600;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-logout-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .header-logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .header-logout-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ======= Login Modal ======= */
        .login-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .login-modal-overlay.show {
            display: flex;
        }

        /* When modal is open, strip sidebar's glass effect and blur it */
        body.login-open .sidebar {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background: rgba(245, 247, 250, 0.25) !important;
            filter: blur(14px) brightness(0.9);
            transition: filter 0.3s ease, background 0.3s ease;
            pointer-events: none;
        }

        [data-theme="dark"] body.login-open .sidebar {
            background: rgba(22, 27, 34, 0.25) !important;
        }

        /* Same for confirm modal */
        body.confirm-open .sidebar {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background: rgba(245, 247, 250, 0.25) !important;
            filter: blur(14px) brightness(0.9);
            transition: filter 0.3s ease, background 0.3s ease;
            pointer-events: none;
        }

        [data-theme="dark"] body.confirm-open .sidebar {
            background: rgba(22, 27, 34, 0.25) !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ======= Toast Notification ======= */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(31, 45, 61, 0.92);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-container svg {
            width: 18px;
            height: 18px;
            stroke: #ff9800;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-modal {
            position: relative;
            width: 380px;
            max-width: calc(100% - 40px);
            padding: 32px 28px 24px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalSlideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: var(--text);
        }

        [data-theme="dark"] .login-modal {
            background: rgba(22, 27, 34, 0.95);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: var(--glass-bg);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .login-modal-close:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .login-modal-close svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .login-modal-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .login-toggle-row {
            display: flex;
            gap: 4px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .login-toggle {
            flex: 1;
            cursor: pointer;
        }

        .login-toggle input {
            display: none;
        }

        .login-toggle span {
            display: block;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .login-toggle input:checked + span {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .login-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .login-modal input[type="text"],
        .login-modal input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            box-sizing: border-box;
        }

        .login-modal input[type="text"]:focus,
        .login-modal input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .login-options {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
            justify-content: center;
        }

        .login-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            user-select: none;
            transition: color 0.2s ease;
        }

        .login-checkbox:hover {
            color: var(--text);
        }

        .login-checkbox input {
            display: none;
        }

        .login-checkbox .checkbox-box {
            position: relative;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 5px;
            background: var(--glass-bg);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
        }

        .login-checkbox .checkbox-box::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 5px;
            width: 5px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg) scale(0);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-checkbox input:checked + .checkbox-box {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(38, 121, 204, 0.35);
        }

        .login-checkbox input:checked + .checkbox-box::after {
            transform: rotate(45deg) scale(1);
        }

        .login-checkbox input:focus-visible + .checkbox-box {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            font-size: 12px;
            color: #ef4444;
            min-height: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, margin 0.25s ease;
        }

        .login-error.show {
            min-height: 18px;

            left: 0;

            display: none;
            position: relative;
            min-height: 400px;
        }

            display: flex;
            flex-direction: column;
        }

        .content-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .frame-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(38, 121, 204, 0.12);
            border-top-color: var(--primary);
            border-radius: 50%;

            border-color: rgba(95, 169, 255, 0.12);
            border-top-color: var(--primary);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ======= Collapsed sidebar ======= */
        body.sidebar-collapsed .sidebar {
            width: 0;
            border-right: none;
            overflow: hidden;
        }

        body.sidebar-collapsed .main {
            margin-left: 0;
        }

        /* ======= Responsive ======= */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 260px;
            }

            .sidebar {
                width: var(--sidebar-width) !important;
                transform: translateX(-100%);
                transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1) !important;
                box-shadow: 8px 0 32px rgba(0, 0, 0, 0.12);
                overflow: visible !important;
                border-right: 1px solid var(--glass-border);
                z-index: 120 !important;
            }

            body.sidebar-open .sidebar {
                transform: translateX(0);
                width: var(--sidebar-width) !important;
            }

            body.sidebar-collapsed .sidebar {
                width: var(--sidebar-width) !important;
                transform: translateX(-100%);
            }

            body.sidebar-open.sidebar-collapsed .sidebar {
                transform: translateX(0);
            }

            body.sidebar-open .main::after {
                content: "";
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(2px);
                z-index: 105;
                animation: fadeIn 0.25s ease;
            }

            body.sidebar-open .main-header {
                z-index: 110;
            }

            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            body.sidebar-open .main {
                margin-left: 0;
            }

            .sidebar-toggle {
                display: flex;
            }

            .sidebar-collapse-icon {
                display: none;
            }

            .main {
                margin-left: 0;
            }

            .welcome-card {
                padding: 40px 28px;
            }

            .welcome {
                padding: 20px;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .main-header {
                padding: 0 16px;
                height: 64px;
            }

            .header-login-btn span {
                display: none;
            }

            .header-login-btn {
                padding: 8px;
            }

            .header-user-value {
                max-width: 80px;
            }

            .header-user-detail {
                display: none;
            }

            .login-modal {
                width: calc(100% - 32px);
                padding: 24px 20px 20px;
            }
        }

        @media (max-width: 480px) {
            :root {
                --sidebar-width: 240px;
            }

            .main-title {

            }

            .sidebar-menu-item {

            }

                width: 30px;
                height: 30px;
            }
        }
        /* ------ Full-screen Watermark ------ */
        #watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;

            text-align: center;
            line-height: 1.3;
            white-space: nowrap;
            will-change: transform;
        }
    </style>

                    <p style="margin-top: 16px;">
                        友链管理规范请查阅 
                        <a class="welcome-link" href="/post/link_sq/" target="_blank" rel="noopener noreferrer">《Sunrise's blog 互链须知》</a>
                    </p>
                </div>

            <!-- iframe Container -->
            <div class="content-frame-wrapper" id="frameWrapper">
                <div class="frame-loader" id="frameLoader"></div>

    <script>
        const frameWrapper = document.getElementById('frameWrapper');
        const contentFrame = document.getElementById('contentFrame');
        const frameLoader = document.getElementById('frameLoader');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainTitle = document.getElementById('mainTitle');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
        const collapseIcon = document.getElementById('collapseIcon');

        // SVG icons for theme toggle
        const sunIcon = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

        // SVG icons for collapse button
        const chevronLeft = '<polyline points="15 18 9 12 15 6"/>';
        const chevronRight = '<polyline points="9 18 15 12 9 6"/>';

        function hideLoader() {
            frameLoader.style.display = 'none';
        }

        // Toast notification
        let toastTimer = null;
        function showToast(message) {
            let toast = document.getElementById('globalToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'globalToast';
                toast.className = 'toast-container';
                toast.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg><span></span>';
                document.body.appendChild(toast);
            }
            toast.querySelector('span').textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function showConfirm(title, message) {
            return new Promise(resolve => {
                const overlay = document.getElementById('confirmModalOverlay');
                const titleEl = document.getElementById('confirmTitle');
                const msgEl = document.getElementById('confirmMessage');
                const okBtn = document.getElementById('confirmOk');
                const cancelBtn = document.getElementById('confirmCancel');

                titleEl.textContent = title;
                msgEl.textContent = message;
                overlay.classList.add('show');
                document.body.classList.add('confirm-open');

                const cleanup = (result) => {
                    overlay.classList.remove('show');
                    document.body.classList.remove('confirm-open');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    overlay.removeEventListener('click', onOverlayClick);
                    document.removeEventListener('keydown', onKey);
                    resolve(result);
                };

                const onOk = () => cleanup(true);
                const onCancel = () => cleanup(false);
                let confirmDragMoved = false;
                const onConfirmMouseDown = (e) => {
                    if (confirmModal.contains(e.target)) {
                        confirmDragMoved = false;
                        const startX = e.clientX, startY = e.clientY;
                        const onMove = (ev) => {
                            if (Math.abs(ev.clientX - startX) > 1 || Math.abs(ev.clientY - startY) > 1) confirmDragMoved = true;
                        };
                        document.addEventListener('mousemove', onMove);
                        setTimeout(() => document.removeEventListener('mousemove', onMove), 100);
                    }
                };
                const onOverlayClick = (e) => {
                    if (e.target === overlay && !confirmDragMoved) cleanup(false);
                };
                const onKey = (e) => { if (e.key === 'Escape') cleanup(false); };

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
                overlay.addEventListener('mousedown', onConfirmMouseDown);
                overlay.addEventListener('click', onOverlayClick);
                document.addEventListener('keydown', onKey);
            });
        }

        async function openContent(item) {
            const title = item.getAttribute('data-title');
            const url = item.getAttribute('data-url');
            const required = PERMISSION_RULES[title] || 'none';
            const level = getCurrentLevel();

            // Permission check
            let allowed = false;
            if (required === 'none') allowed = true;
            else if (required === 'email') allowed = (level === 'email' || level === 'owner');
            else if (required === 'owner') allowed = (level === 'owner');

            // Special case: owner logged in, tries to find back ID
            if (title === '找回站长ID' && level === 'owner') {
                const state = getLoginState();
                if (state) {
                    const confirmed = await showConfirm('确认', '您当前已登录 ' + getDisplayValue(state) + '，是否继续找回站长ID？');
                    if (!confirmed) return;
                }
            }

            if (!allowed) {
                // Show toast notification
                const tooltipText = item.getAttribute('data-tooltip') || '请先登录';
                showToast(tooltipText);
                // Flash the item
                item.style.transition = 'opacity 0.3s';
                item.style.opacity = '0.3';
                setTimeout(() => { item.style.opacity = ''; }, 300);
                return;
            }

            // Update active state
            document.querySelectorAll('.sidebar-menu-item').forEach(el => {
                el.classList.remove('active');
            });
            item.classList.add('active');

            // Update title
            mainTitle.textContent = title;

            // Show frame, hide welcome
            welcomeScreen.style.display = 'none';
            frameWrapper.classList.add('active');

            // Load iframe
            frameLoader.style.display = 'block';
            let finalUrl = url;
            console.log('[openContent] title:', title, 'level:', level, 'baseUrl:', url);
            if (title === '修改友链' && level === 'owner') {
                const state = getLoginState();
                if (state) {
                    const fieldName = encodeURIComponent('站长ID');
                    const val = encodeURIComponent(state.value);
                    finalUrl = url + '?prefill_' + fieldName + '=' + val + '&hide_' + fieldName + '=1';
                    console.log('[openContent] 修改友链 finalUrl:', finalUrl);
                }
            } else if (title === '找回站长ID' && level === 'email') {
                const state = getLoginState();
                if (state) {
                    const fieldName = encodeURIComponent('请输入您提交友链申请时使用的邮箱');
                    const emailVal = encodeURIComponent(state.value);
                    finalUrl = url + '?prefill_' + fieldName + '=' + emailVal + '&hide_' + fieldName + '=1';
                    console.log('[openContent] 找回站长ID finalUrl:', finalUrl);
                }
            }
            console.log('[openContent] finalUrl:', finalUrl);
            contentFrame.src = finalUrl;

            // Close mobile sidebar
            if (window.innerWidth <= 768) {
                document.body.classList.remove('sidebar-open');
            }
        }

        // iframe load event
        contentFrame.addEventListener('load', function() {
            hideLoader();
        });

        // Mobile sidebar toggle
        sidebarToggle.addEventListener('click', function() {
            document.body.classList.toggle('sidebar-open');
        });

        // Close mobile sidebar when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 &&
                document.body.classList.contains('sidebar-open') &&
                !sidebar.contains(e.target) &&
                !sidebarToggle.contains(e.target) &&
                !sidebarCollapseBtn.contains(e.target)) {
                document.body.classList.remove('sidebar-open');
            }
        });

        // Collapse/expand sidebar with persistence
        function applyCollapsedState(collapsed) {
            if (collapsed) {
                document.body.classList.add('sidebar-collapsed');
                collapseIcon.innerHTML = chevronRight;
            } else {
                document.body.classList.remove('sidebar-collapsed');
                collapseIcon.innerHTML = chevronLeft;
            }
        }

        // Restore saved collapsed state
        applyCollapsedState(localStorage.getItem('sidebarCollapsed') === 'true');

        sidebarCollapseBtn.addEventListener('click', function() {
            const collapsed = !document.body.classList.contains('sidebar-collapsed');
            applyCollapsedState(collapsed);
            localStorage.setItem('sidebarCollapsed', collapsed);
        });

        // ------ Theme toggle ------
        function getPreferredTheme() {
            const saved = localStorage.getItem('friendLinkTheme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.innerHTML = sunIcon;
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.innerHTML = moonIcon;
            }
            localStorage.setItem('friendLinkTheme', theme);
        }

        // Init theme
        applyTheme(getPreferredTheme());

        themeToggle.addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ======= Login & Permission System =======
        const loginValueInput = document.getElementById('loginValue');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginTypeRadios = document.querySelectorAll('input[name="loginType"]');
        const rememberCheckbox = document.getElementById('rememberAccount');
        const autoLoginCheckbox = document.getElementById('autoLogin');
        const loginModalOverlay = document.getElementById('loginModalOverlay');
        const openLoginModalBtn = document.getElementById('openLoginModal');
        const closeLoginModalBtn = document.getElementById('closeLoginModal');
        const headerUser = document.getElementById('headerUser');
        const headerUserIcon = document.getElementById('headerUserIcon');
        const headerUserLabel = document.getElementById('headerUserLabel');
        const headerUserValue = document.getElementById('headerUserValue');
        const headerLogoutBtn = document.getElementById('headerLogout');

        const EMAIL_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
        const OWNER_ICON = '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>';
        const LOGOUT_ICON = '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';

        // Permission rules
        const PERMISSION_RULES = {
            '申请友链': 'none',
            '修改友链': 'owner',
            '找回站长ID': 'email',
            '友链状态查询': 'none'
        };

        function getLoginState() {
            const type = localStorage.getItem('loginType');
            const value = localStorage.getItem('loginValue');
            if (!type || !value) return null;
            return { type, value };
        }

        function maskOwnerId(id) {
            if (!id) return '';
            if (id.length <= 8) return id;
            return id.substring(0, 5) + '********' + id.substring(id.length - 3);
        }

        function getDisplayValue(state) {
            if (!state) return '';
            if (state.type === 'owner') return maskOwnerId(state.value);
            return state.value;
        }

        function getCurrentLevel() {
            const state = getLoginState();
            if (!state) return 'none';
            return state.type;
        }

        function updateMenuPermissions() {
            const level = getCurrentLevel();
            document.querySelectorAll('.sidebar-menu-item').forEach(item => {
                const title = item.getAttribute('data-title');
                const required = PERMISSION_RULES[title] || 'none';
                let allowed = false;
                let tooltipText = '';
                if (required === 'none') {
                    allowed = true;
                } else if (required === 'email') {
                    allowed = (level === 'email' || level === 'owner');
                    if (!allowed) tooltipText = '需登录后使用';
                } else if (required === 'owner') {
                    allowed = (level === 'owner');
                    if (!allowed) {
                        if (level === 'email') {
                            tooltipText = '站长ID登录后可使用该功能';
                        } else {
                            tooltipText = '需站长ID登录后使用';
                        }
                    }
                }
                if (allowed) {
                    item.classList.remove('locked');
                    item.removeAttribute('data-tooltip');
                } else {
                    item.classList.add('locked');
                    item.setAttribute('data-tooltip', tooltipText);
                }
            });
        }

        function updateHeaderUI() {
            const state = getLoginState();
            if (state) {
                openLoginModalBtn.style.display = 'none';
                headerUser.style.display = 'flex';
                headerUserValue.textContent = getDisplayValue(state);
                if (state.type === 'owner') {
                    headerUserLabel.textContent = '站长';
                    headerUserIcon.innerHTML = OWNER_ICON;
                } else {
                    headerUserLabel.textContent = '邮箱用户';
                    headerUserIcon.innerHTML = EMAIL_ICON;
                }
            } else {
                openLoginModalBtn.style.display = 'flex';
                headerUser.style.display = 'none';
            }
        }

        function openLoginModal() {
            loginModalOverlay.classList.add('show');
            document.body.classList.add('login-open');
            // Pre-fill remembered values
            const rType = localStorage.getItem('rememberedType');
            const rValue = localStorage.getItem('rememberedValue');
            if (rType && rValue) {
                const radio = document.querySelector('input[name="loginType"][value="' + rType + '"]');
                if (radio) radio.checked = true;
                loginValueInput.value = rValue;
                rememberCheckbox.checked = true;
            } else {
                loginValueInput.value = '';
                rememberCheckbox.checked = false;
            }
            updateLoginPlaceholder();
            loginError.classList.remove('show');
            setTimeout(() => loginValueInput.focus(), 100);
        }

        function closeLoginModal() {
            loginModalOverlay.classList.remove('show');
            document.body.classList.remove('login-open');
            loginError.classList.remove('show');
        }

        function showLoginError(msg) {
            loginError.textContent = msg;
            loginError.classList.add('show');
            setTimeout(() => loginError.classList.remove('show'), 2500);
        }

        function updateLoginPlaceholder() {
            const type = document.querySelector('input[name="loginType"]:checked').value;
            loginValueInput.placeholder = type === 'owner' ? '请输入站长ID' : '请输入邮箱';
            loginValueInput.type = type === 'owner' ? 'password' : 'text';
            loginValueInput.value = '';
        }

        function handleLogin() {
            const type = document.querySelector('input[name="loginType"]:checked').value;
            const value = loginValueInput.value.trim();

            if (!value) {
                showLoginError('请输入' + (type === 'owner' ? '站长ID' : '邮箱'));
                return;
            }

            if (type === 'owner') {
                if (!/^SUN[A-Za-z0-9]{12}$/.test(value)) {
                    showLoginError('站长ID错误');
                    return;
                }
            } else if (type === 'email') {
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                    showLoginError('邮箱格式错误');
                    return;
                }
            }

            // Save login state
            localStorage.setItem('loginType', type);
            localStorage.setItem('loginValue', value);

            // Handle remember
            if (rememberCheckbox.checked) {
                localStorage.setItem('rememberedType', type);
                localStorage.setItem('rememberedValue', value);
            } else {
                localStorage.removeItem('rememberedType');
                localStorage.removeItem('rememberedValue');
            }

            // Handle auto-login flag (for future sessions)
            if (autoLoginCheckbox.checked) {
                localStorage.setItem('autoLogin', 'true');
            } else {
                localStorage.removeItem('autoLogin');
            }

            closeLoginModal();
            updateHeaderUI();
            updateMenuPermissions();
            updateWatermark();
        }

        function handleLogout() {
            // Remove login state but keep remembered account
            localStorage.removeItem('loginType');
            localStorage.removeItem('loginValue');
            // Clear auto-login flag so next refresh won't auto-login
            localStorage.removeItem('autoLogin');
            // Keep rememberedType/rememberedValue if user chose "remember"
            updateHeaderUI();
            updateMenuPermissions();
            updateWatermark();
            // Return to welcome screen
            welcomeScreen.style.display = 'flex';
            frameWrapper.classList.remove('active');
            contentFrame.src = '';
            mainTitle.textContent = '友情链接管理';
            // Clear active menu state
            document.querySelectorAll('.sidebar-menu-item').forEach(el => {
                el.classList.remove('active');
            });
        }

        // Override openContent to check permissions
        const originalOpenContent = openContent;
        openContent = function(item) {
            if (item.classList.contains('disabled')) {
                const title = item.getAttribute('data-title');
                const required = PERMISSION_RULES[title] || 'none';
                let msg = '请先登录后使用此功能';
                if (required === 'owner') msg = '此功能仅站长可使用，请使用站长ID登录';
                alert(msg);
                return;
            }
            originalOpenContent(item);
        };

        // Bind events
        openLoginModalBtn.addEventListener('click', openLoginModal);
        closeLoginModalBtn.addEventListener('click', closeLoginModal);
        loginBtn.addEventListener('click', handleLogin);
        loginValueInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        loginTypeRadios.forEach(radio => radio.addEventListener('change', updateLoginPlaceholder));
        headerLogoutBtn.addEventListener('click', handleLogout);

        // Sync auto-login with remember account
        autoLoginCheckbox.addEventListener('change', function() {
            if (this.checked) {
                rememberCheckbox.checked = true;
            }
        });
        rememberCheckbox.addEventListener('change', function() {
            if (!this.checked) {
                autoLoginCheckbox.checked = false;
            }
        });

        // Close modal on overlay click (with drag-protection for text selection)
        let mouseDownPos = null;
        let mouseMoved = false;
        let globalMouseDownPos = null;
        let modalDragging = false;

        // Track mousedown globally to detect drag-start-inside-modal
        document.addEventListener('mousedown', function(e) {
            if (loginModalOverlay.classList.contains('show') && loginModal.contains(e.target)) {
                globalMouseDownPos = { x: e.clientX, y: e.clientY };
                modalDragging = false;
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (globalMouseDownPos) {
                const dx = Math.abs(e.clientX - globalMouseDownPos.x);
                const dy = Math.abs(e.clientY - globalMouseDownPos.y);
                if (dx > 1 || dy > 1) modalDragging = true;
            }
        });

        loginModalOverlay.addEventListener('mousedown', function(e) {
            if (e.target === loginModalOverlay) {
                mouseDownPos = { x: e.clientX, y: e.clientY };
                mouseMoved = false;
            } else {
                mouseDownPos = null;
            }
        });
        loginModalOverlay.addEventListener('mousemove', function(e) {
            if (mouseDownPos) {
                const dx = Math.abs(e.clientX - mouseDownPos.x);
                const dy = Math.abs(e.clientY - mouseDownPos.y);
                if (dx > 1 || dy > 1) mouseMoved = true;
            }
        });
        loginModalOverlay.addEventListener('click', function(e) {
            if (e.target === loginModalOverlay && !mouseMoved && !modalDragging) {
                closeLoginModal();
            }
            mouseDownPos = null;
            mouseMoved = false;
            globalMouseDownPos = null;
            modalDragging = false;
        });

        // Close modal on ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && loginModalOverlay.classList.contains('show')) {
                closeLoginModal();
            }
        });

        // Menu item click interception for disabled items
        document.querySelectorAll('.sidebar-menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (item.classList.contains('disabled')) {
                    e.preventDefault();
                    e.stopPropagation();
                    const title = item.getAttribute('data-title');
                    const required = PERMISSION_RULES[title] || 'none';
                    let msg = '请先登录后使用此功能';
                    if (required === 'owner') msg = '此功能仅站长可使用，请使用站长ID登录';
                    alert(msg);
                }
            });
        });

        // Init: auto-login or restore
        (function initAuth() {
            const autoLogin = localStorage.getItem('autoLogin') === 'true';
            const rememberedType = localStorage.getItem('rememberedType');
            const rememberedValue = localStorage.getItem('rememberedValue');

            if (autoLogin && rememberedType && rememberedValue) {
                // Auto-login: restore full state
                localStorage.setItem('loginType', rememberedType);
                localStorage.setItem('loginValue', rememberedValue);
            } else if (rememberedType && rememberedValue) {
                // Remember only: pre-fill values for next login
                // (values will be shown when modal opens)
            }
            // If neither, user must log in fresh

            updateHeaderUI();
            updateMenuPermissions();
        })();

        // ------ Watermark Logic (DOM-based, zero clipping) ------
        const watermarkEl = document.getElementById('watermark');
        let deviceIP = '';

        // Fetch client IP from public API
        async function fetchDeviceIP() {
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const data = await resp.json();
                if (data && data.ip) {
                    deviceIP = data.ip;
                    updateWatermark();
                }
            } catch (e) {
                // Fallback: try another API
                try {
                    const resp2 = await fetch('https://ifconfig.me/all.json');
                    const data2 = await resp2.json();
                    if (data2 && data2.ip_addr) {
                        deviceIP = data2.ip_addr;
                        updateWatermark();
                    }
                } catch (e2) {
                    // IP unavailable, keep as empty string
                }
            }
        }
        fetchDeviceIP();

        function formatTimestamp(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
                + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
        }

        function getWatermarkText() {
            const state = getLoginState();
            const now = formatTimestamp(new Date());
            let status = '';
            if (!state) {
                status = '未登录用户';
            } else if (state.type === 'email') {
                status = '邮箱登录 ' + state.value;
            } else {
                status = '站长ID登录 ' + maskOwnerId(state.value);
            }
            return { line1: now, line2: status, line3: deviceIP || '' };
        }

        // Measure rotated bounding box of a single watermark element
        function measureWatermark(line1, line2, line3) {
            const probe = document.createElement('div');
            probe.className = 'watermark-item';
            probe.style.visibility = 'hidden';
            probe.style.position = 'absolute';
            probe.style.left = '-9999px';
            probe.style.top = '-9999px';
            // Always reserve 3 lines; if line3 is empty, use a placeholder space to keep height
            const line3Content = line3 || '&nbsp;';
            probe.innerHTML = line1 + '<br>' + line2 + '<br>' + line3Content;
            document.body.appendChild(probe);
            const rect = probe.getBoundingClientRect();
            document.body.removeChild(probe);

            const w = rect.width;
            const h = rect.height;
            const angle = -Math.PI / 8; // -22.5deg
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const rotatedW = Math.abs(w * cos) + Math.abs(h * sin);
            const rotatedH = Math.abs(w * sin) + Math.abs(h * cos);

            return { w, h, rotatedW, rotatedH };
        }

        // Render watermarks covering the full viewport with brick pattern
        let watermarkLayoutCache = null;

        function renderWatermarks(line1, line2, line3) {
            const { rotatedW, rotatedH } = measureWatermark(line1, line2, line3);
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            // Tighter gaps for higher density
            const gapX = 70;
            const gapY = 55;
            const stepX = rotatedW + gapX;
            const stepY = rotatedH + gapY;

            // Start watermarks off-screen (negative offsets) so they extend beyond viewport
            const startX = -stepX;
            const startY = -stepY;

            // Continue watermarks beyond viewport boundaries
            const endX = vw + stepX * 2;
            const endY = vh + stepY * 2;

            // Calculate grid to cover from start to end
            const cols = Math.ceil((endX - startX) / stepX);
            const rows = Math.ceil((endY - startY) / stepY);

            watermarkEl.innerHTML = '';

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    // Brick pattern: odd rows offset by half a cell
                    const offsetX = (row % 2 === 1) ? stepX / 2 : 0;
                    const x = startX + col * stepX + offsetX;
                    const y = startY + row * stepY;

                    const item = document.createElement('div');
                    item.className = 'watermark-item';
                    item.style.left = x + 'px';
                    item.style.top = y + 'px';
                    // Always reserve 3 lines; hide line3 visually if empty but keep its height
                    if (line3) {
                        item.innerHTML = line1 + '<br>' + line2 + '<br>' + line3;
                    } else {
                        item.innerHTML = line1 + '<br>' + line2 + '<br><span style="visibility:hidden">&nbsp;</span>';
                    }
                    watermarkEl.appendChild(item);
                }
            }

            // Cache layout info for resize handling
            watermarkLayoutCache = { rotatedW, rotatedH, gapX, gapY, vw, vh };
        }

        function updateWatermark() {
            const { line1, line2, line3 } = getWatermarkText();
            renderWatermarks(line1, line2, line3);
        }

        // Re-render on window resize
        window.addEventListener('resize', function() {
            const { line1, line2, line3 } = getWatermarkText();
            renderWatermarks(line1, line2, line3);
        });

        // Update every second for real-time timestamp
        setInterval(updateWatermark, 1000);

        // Initial watermark render
        updateWatermark();

        // Hook watermark update into login/logout
        const origUpdateHeaderUI = updateHeaderUI;
        updateHeaderUI = function() {
            origUpdateHeaderUI();
            updateWatermark();
        };
    </script>
</body>
</html>
