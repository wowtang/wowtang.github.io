<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise's blog · 友联工单系统</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    width:100%;
    height:100%;
}
iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}
.mobile-box{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
}
.open-btn{
    padding:14px 24px;
    font-size:18px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>
<script>
function isMobile() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}
const formUrl = "https://sunrise-studio.feishu.cn/share/base/webpage/shrcnXcPJEb8G1brqpk36nIWTWe?share_link_type=qrcode";
if(isMobile()){
    let popup = window.open(formUrl, "_blank");
    // 判断弹窗是否被浏览器拦截，失败则显示按钮
    if (!popup || popup.closed || typeof popup.closed === 'undefined') {
        document.body.innerHTML = `
        <div class="mobile-box">
            <div>自动跳转失败，请点击下方按钮打开系统</div>
            <button class="open-btn" onclick="window.open('${formUrl}','_blank')">打开工单系统</button>
        </div>
        `;
    } else {
        // 弹窗成功打开，当前页面提示
        document.body.innerHTML = `
        <div class="mobile-box">
            <div>工单系统已在新标签页打开</div>
        </div>
        `;
    }
}else{
    const iframe = document.createElement('iframe');
    iframe.src = formUrl;
    document.body.appendChild(iframe);
}
</script>
</body>
</html>
